name: Android CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  actions: read
  issues: write

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    env:
      JAVA_HOME: /opt/java/openjdk-17
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      # 1. 檢出代碼
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 設置 JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # 可以根據需要選擇其他分發版
          java-version: '17'

      # 3. 設置 Android SDK
      - name: Download Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          target: default
          arch: x64
          cache: true

      # 4. 解碼並設置 keystore 文件（僅在構建 APK 時需要）
      - name: Decode keystore
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > ${{ github.workspace }}/keystore.jks

      # 5. 授予 Gradle wrapper 執行權限
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      # 6. 運行 Lint 檢查
      - name: Run Lint
        run: ./gradlew lint

      # 7. 提取 PR 號碼（如果是 Pull Request 事件）
      - name: Extract PR Number
        id: get_pr_number
        if: github.event_name == 'pull_request'
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      # 8. 提取版本號
      - name: Extract Version Number
        id: get_version
        run: |
          # 如果使用 Kotlin DSL（build.gradle.kts）
          VERSION_NAME=$(awk -F'"' '/versionName/ {print $2}' app/build.gradle.kts)
          # 如果使用 Groovy DSL（build.gradle），請取消下行的註釋並註解上行
          # VERSION_NAME=$(grep versionName app/build.gradle | awk '{print $2}' | tr -d \")
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV

      # 9. 獲取當前日期和時間
      - name: Get current date and time
        id: get_datetime
        run: | 
          DATETIME=$(date +%Y%m%d-%H%M)
          echo "DATETIME=$DATETIME" >> $GITHUB_ENV

      # 10. 設置 Lint 報告的工件名稱
      - name: Set Lint Artifact Name
        id: set_lint_artifact_name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARTIFACT_NAME="lint-report-pr-${PR_NUMBER}-v-${VERSION_NAME}"
          else
            ARTIFACT_NAME="lint-report-v-${VERSION_NAME}"
          fi
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV

      # 11. 上傳 Lint 報告
      - name: Upload Lint Report
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: app/build/reports/lint-results-debug.html

      # 可選步驟：發布下載鏈接到 PR 評論中
      - name: Fetch Artifact URLs
        id: fetch_artifacts
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f1)
          REPO=$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)
          RUN_ID=${{ github.run_id }}

          # 使用 GitHub API 獲取工件列表
          ARTIFACTS_JSON=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$OWNER/$REPO/actions/runs/$RUN_ID/artifacts")

          # 提取工件的下載 URL
          ARTIFACT_DOWNLOAD_URL=$(echo "$ARTIFACTS_JSON" | jq -r --arg NAME "$ARTIFACT_NAME" '.artifacts[] | select(.name == $NAME) | .archive_download_url')

          # 構建帶有認證的下載鏈接
          LINT_LINK="https://api.github.com/repos/$OWNER/$REPO/actions/artifacts/$ARTIFACT_DOWNLOAD_URL/zip"

          # 構建評論內容
          COMMENT="### Android Lint Report
- [Download Lint Report]($ARTIFACT_DOWNLOAD_URL)"

          # 發布評論到 PR
          PR_NUMBER=${{ github.event.pull_request.number }}
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
               -X POST \
               -d "{\"body\": \"$COMMENT\"}" \
               "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"

      # 12. 構建 Debug 版 APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 13. 構建 Release 版 APK
      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # 14. 修改 Debug APK 的名稱，加入版本和時間
      - name: Rename Debug APK
        run: |
          ORIGINAL_APK=app/build/outputs/apk/debug/app-debug.apk
          NEW_APK=app/build/outputs/apk/debug/app-debug-v${{ env.VERSION_NAME }}-${{ env.DATETIME }}.apk
          mv "$ORIGINAL_APK" "$NEW_APK"

      # 15. 修改 Release APK 的名稱，加入版本和時間
      - name: Rename Release APK
        run: |
          ORIGINAL_APK=app/build/outputs/apk/release/app-release.apk
          NEW_APK=app/build/outputs/apk/release/app-release-v${{ env.VERSION_NAME }}-${{ env.DATETIME }}.apk
          mv "$ORIGINAL_APK" "$NEW_APK"

      # 16. 上傳重命名後的 Debug APK 作為構建產物
      - name: Upload Debug APK
        uses: actions/upload-artifact@v3
        with:
          name: debug-apk-v${{ env.VERSION_NAME }}-${{ env.DATETIME }}.apk
          path: app/build/outputs/apk/debug/app-debug-v${{ env.VERSION_NAME }}-${{ env.DATETIME }}.apk

      # 17. 上傳重命名後的 Release APK 作為構建產物
      - name: Upload Release APK
        uses: actions/upload-artifact@v3
        with:
          name: release-apk-v${{ env.VERSION_NAME }}-${{ env.DATETIME }}.apk
          path: app/build/outputs/apk/release/app-release-v${{ env.VERSION_NAME }}-${{ env.DATETIME }}.apk
