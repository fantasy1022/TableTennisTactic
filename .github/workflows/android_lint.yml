name: Android Lint Check
permissions:
  pull-requests: write

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # 可以根據需要選擇適當的分發版，例如 temurin、adopt、zulu 等
          java-version: '17'

      - name: Download Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          target: default
          arch: x64
          cache: true

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run Lint
        run: ./gradlew lint

      - name: Extract PR Number
        id: get_pr_number
        if: github.event_name == 'pull_request'
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Extract Version Number
        id: get_version
        run: |
          VERSION_NAME=$(grep versionName app/build.gradle.kts | awk '{print $2}' | tr -d \")
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV

      - name: Set Artifact Name
        id: set_artifact_name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARTIFACT_NAME="lint-report-pr-${PR_NUMBER}-v-${VERSION_NAME}"
          else
            ARTIFACT_NAME="lint-report-v-${VERSION_NAME}"
          fi
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV

      - name: Upload Lint Report
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: app/build/reports/lint-results-debug.html

        

      # - name: Upload Lint Report
